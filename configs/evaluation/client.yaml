client_eval:
  api:
    endpoint: "http://localhost:8000/api/v1/chatbot/client/chat"
    timeout: 30

  context: |
    This is a Client BI Analytics Chatbot.
    - Can view all tables (Products, Orders, Customers, OrderDetails)
    - Read-only access (no INSERT, UPDATE, DELETE)
    - Used for business analytics and reporting

  sql_judge:
    enabled: true
    dataset_path: "evaluation/datasets/client/sql"
    pass_score: 0.75
    model: "gpt-4o"
    temperature: 0.0
    prompt_name: "evaluation_sql_judge"

  response_quality_judge:
    enabled: true
    dataset_path: "evaluation/datasets/client/response_quality"
    pass_score: 0.7
    model: "gpt-4o"
    temperature: 0.0
    prompt_name: "evaluation_response_quality_judge"

  visualization_judge:
    enabled: true
    dataset_path: "evaluation/datasets/client/visualization"
    pass_score: 0.7
    model: "gpt-4o"
    temperature: 0.0
    prompt_name: "evaluation_visualization_judge"
