client_eval:
  api:
    endpoint: "http://localhost:8000/api/v1/chatbot/client/chat"
    timeout: 180

  dataset_path: "evaluation/datasets/client"
  results_path: "results/client"
  pass_threshold: 0.7

  context: |
    This is a Client BI Analytics Chatbot.
    - Can view all tables (Products, Orders, Customers, OrderDetails)
    - Read-only access (no INSERT, UPDATE, DELETE)
    - Used for business analytics and reporting

  sql_judge:
    enabled: true
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 16384
    prompt:
      name: "evaluation_evaluation_sql_judge"
      label: "latest"

  response_quality_judge:
    enabled: true
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 16384
    prompt:
      name: "evaluation_evaluation_response_quality_judge"
      label: "latest"

  visualization_judge:
    enabled: true
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 16384
    prompt:
      name: "evaluation_evaluation_visualization_judge"
      label: "latest"
