customer_eval:
  api:
    endpoint: "http://localhost:8000/api/v1/chatbot/customer/chat"
    timeout: 30

  context: |
    This is a Customer Support Chatbot.
    - Can only view Products catalog
    - Cannot access other customers' data
    - Cannot view business analytics or revenue
    - Can place orders for themselves only

  sql_judge:
    enabled: true
    dataset_path: "evaluation/datasets/customer/sql"
    pass_score: 0.75
    model: "gpt-4o"
    temperature: 0.0
    prompt_name: "evaluation_sql_judge"

  search_judge:
    enabled: true
    dataset_path: "evaluation/datasets/customer/search"
    pass_score: 0.6

  response_quality_judge:
    enabled: true
    dataset_path: "evaluation/datasets/customer/response_quality"
    pass_score: 0.7
    model: "gpt-4o"
    temperature: 0.0
    prompt_name: "evaluation_response_quality_judge"
