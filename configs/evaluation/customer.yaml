customer_eval:
  api:
    endpoint: "http://localhost:8000/api/v1/chatbot/customer/chat"
    timeout: 180

  dataset_path: failed_round2/customer
  # dataset_path: "data/eval_datasets/customer"
  results_path: "results/customer"
  pass_threshold: 0.7

  context: |
    This is a Customer Support Chatbot.
    - Can only view Products catalog
    - Cannot access other customers' data
    - Cannot view business analytics or revenue
    - Can place orders for themselves only

  sql_judge:
    enabled: true
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 16384
    prompt:
      name: "evaluation_judges_sql_judge"
      label: "latest"

  search_judge:
    enabled: true
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 16384
    prompt:
      name: "evaluation_judges_search_judge"
      label: "latest"

  response_quality_judge:
    enabled: true
    model: "gpt-4o"
    temperature: 0.0
    max_tokens: 16384
    prompt:
      name: "evaluation_judges_response_quality_judge"
      label: "latest"
