name: sql_multi_turn_place_order
description: Multi-turn conversations for placing customer orders

test_cases:
  - id: place_order_ring_light
    turns:
      - input:
          question: "I want to buy LED Ring Light"
        expected_output:
          response_quality: "Product information shown"
      - input:
          question: "Yes, I want to order 2 of them"
        expected_output:
          sql:
            - "SELECT * FROM Products WHERE product_name = 'LED Ring Light'"
            - "SELECT SUM(quantity) as available FROM Inventory WHERE product_id = 11"
            - "INSERT INTO Orders (order_date, customer_id, total_amount) VALUES (CURRENT_TIMESTAMP, 1, 508)"
            - "INSERT INTO OrderDetails (order_id, product_id, quantity, price, total_price) VALUES (999, 11, 2, 254, 508)"
            - "UPDATE Inventory SET quantity = quantity - 2 WHERE product_id = 11"
          response_quality: "Order confirmation with order details"

  - id: place_order_with_stock_check
    turns:
      - input:
          question: "Do you have Electric Toothbrush in stock?"
        expected_output:
          sql: "SELECT SUM(quantity) as available FROM Inventory WHERE product_id = 30"
          response_quality: "Stock availability information"
      - input:
          question: "Great, I'd like to order 3"
        expected_output:
          sql:
            - "SELECT * FROM Products WHERE product_id = 30"
            - "SELECT SUM(quantity) as available FROM Inventory WHERE product_id = 30"
            - "INSERT INTO Orders (order_date, customer_id, total_amount) VALUES (CURRENT_TIMESTAMP, 1, 654)"
            - "INSERT INTO OrderDetails (order_id, product_id, quantity, price, total_price) VALUES (999, 30, 3, 218, 654)"
            - "UPDATE Inventory SET quantity = quantity - 3 WHERE product_id = 30"
          response_quality: "Order placed successfully"

  - id: place_order_out_of_stock_headphones
    turns:
      - input:
          question: "I want to buy Wireless Bluetooth Headphones"
        expected_output:
          response_quality: "Product information shown with out of stock notice and alternatives"
      - input:
          question: "Yes, I want to order 2 of them"
        expected_output:
          response_quality: "Clarification asking which available product to order"

  - id: browse_then_order
    turns:
      - input:
          question: "What products do you have in the electronics category?"
        expected_output:
          sql: "SELECT * FROM Products WHERE category LIKE '%Electronics%'"
          response_quality: "List of electronics products"
      - input:
          question: "How much is the fitness tracker?"
        expected_output:
          sql: "SELECT price FROM Products WHERE product_name LIKE '%Fitness Tracker%'"
          response_quality: "Price information"
      - input:
          question: "I'll take one please"
        expected_output:
          sql:
            - "SELECT * FROM Products WHERE product_name LIKE '%Fitness Tracker%'"
            - "SELECT SUM(quantity) as available FROM Inventory WHERE product_id = 3"
            - "INSERT INTO Orders (order_date, customer_id, total_amount) VALUES (CURRENT_TIMESTAMP, 1, 377)"
            - "INSERT INTO OrderDetails (order_id, product_id, quantity, price, total_price) VALUES (999, 3, 1, 377, 377)"
            - "UPDATE Inventory SET quantity = quantity - 1 WHERE product_id = 3"
          response_quality: "Order confirmation"
