name: sql_multi_turn_conversation
description: Multi-turn SQL query conversations

test_cases:
  - id: product_price_inquiry
    turns:
      - input:
          question: "I want headphones"
        expected_output:
          response_quality: "We have Wireless Bluetooth Headphones and Noise Cancelling Headphones"
      - input:
          question: "How much is the noise cancelling one?"
        expected_output:
          sql: "SELECT price FROM Products WHERE product_name = 'Noise Cancelling Headphones'"

  - id: customer_order_history
    turns:
      - input:
          question: "Tell me about Brenda Ross"
        expected_output:
          sql: "SELECT * FROM Customers WHERE customer_name = 'Brenda Ross'"
      - input:
          question: "How many orders does she have?"
        expected_output:
          sql: "SELECT COUNT(*) FROM Orders WHERE customer_id = 1"

  - id: product_category_drill_down
    turns:
      - input:
          question: "What categories do you have?"
        expected_output:
          sql: "SELECT DISTINCT category FROM Products"
      - input:
          question: "Show me Smart Home products"
        expected_output:
          sql: "SELECT * FROM Products WHERE category = 'Smart Home'"
      - input:
          question: "Which one is the most expensive?"
        expected_output:
          sql: "SELECT * FROM Products WHERE category = 'Smart Home' ORDER BY price DESC LIMIT 1"
