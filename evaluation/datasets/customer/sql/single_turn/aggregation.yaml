name: sql_aggregation
description: Test COUNT, SUM, AVG aggregation queries

test_cases:
  - id: count_all_products
    input:
      question: "How many products do you have?"
    expected_output:
      sql: "SELECT COUNT(*) FROM Products"

  - id: count_home_kitchen
    input:
      question: "How many products are in Home & Kitchen category?"
    expected_output:
      sql: "SELECT COUNT(*) FROM Products WHERE category = 'Home & Kitchen'"

  - id: total_orders
    input:
      question: "How many orders are there in total?"
    expected_output:
      sql: "SELECT COUNT(*) FROM Orders"

  - id: avg_product_price
    input:
      question: "What is the average price of products?"
    expected_output:
      sql: "SELECT AVG(price) FROM Products"
